# Stage @cloudbase/open-agent-kernel for npm publish.
#
# `npm stage publish` uploads the tarball but does not make it installable.
# A maintainer approves it with 2FA (`npm stage approve <id>`, or the
# Staged Packages tab on npmjs.com) before the version goes live.
#
# Requires npm CLI >= 11.15.0 and Node.js >= 22.14.
#
# Authentication is npm Trusted Publishing (GitHub Actions OIDC). No NPM_TOKEN.
# On the package, the trusted publisher must be:
#   owner/repo:  TencentCloudBase/OpenAgentKernel
#   workflow:    publish.yml
#   permission:  npm stage publish only
# package.json repository.url must point at that same GitHub repository.
#
# Trigger: Actions → Stage publish to npm → Run workflow

name: Stage publish to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        default: prerelease
        options:
          - prerelease
          - prepatch
          - preminor
          - premajor
          - patch
          - minor
          - major
      preid:
        description: Prerelease identifier (prerelease / prepatch / preminor / premajor)
        required: false
        default: beta
        type: string

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Guard branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Publishing is only allowed from main. Current ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install npm with staged publishing
        run: npm install -g npm@^11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
        run: |
          set -euo pipefail
          if [[ "$BUMP" == pre* ]]; then
            pnpm version "$BUMP" --preid "${PREID:-beta}" -m "chore(release): v%s"
          else
            pnpm version "$BUMP" -m "chore(release): v%s"
          fi

          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "Bumped to v${VERSION}"

      - name: Stage publish to npm
        run: npm stage publish --access public --git-checks=false --tag "${{ steps.bump.outputs.tag }}"

      - name: Push version commit and tag
        run: git push origin HEAD --follow-tags

      - name: Summary
        run: |
          {
            echo "## Staged @cloudbase/open-agent-kernel@${{ steps.bump.outputs.version }}"
            echo ""
            echo "The version is not installable until a maintainer approves it with 2FA."
            echo ""
            echo "- bump: \`${{ inputs.bump }}\`"
            echo "- npm dist-tag: \`${{ steps.bump.outputs.tag }}\`"
            echo "- approve: \`npm stage list @cloudbase/open-agent-kernel\` then \`npm stage approve <id>\`"
            echo "- or: https://www.npmjs.com/package/@cloudbase/open-agent-kernel (Staged Packages)"
          } >> "$GITHUB_STEP_SUMMARY"
